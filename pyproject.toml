[project]
name = "virtual-patient-simulator"
version = "0.1.0"
description = "LLM-augmented virtual patient drug-response simulator (hypertension domain)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "qdrant-client>=1.11.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "rdkit>=2024.3.5",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "joblib>=1.4.0",
    "fastembed>=0.8.0",
    "streamlit>=1.60.0",
    "langchain-ollama>=1.1.0",
    "unsloth>=2026.8.4",
    "trl>=0.24.0",
    "peft>=0.20.0",
    "accelerate>=1.14.0",
    "bitsandbytes>=0.50.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# app/db/session.py's `engine` is a module-level singleton, so its
# connection pool gets bound to whichever event loop first uses it.
# pytest-asyncio's default per-test loop scope creates a NEW loop per
# test, which breaks that pool on the second async DB test ("cannot
# perform operation: another operation is in progress") — session-scoped
# loops keep it on one loop for the whole run, matching how the app
# actually runs in production (one process, one loop).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
